name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Quality & Production Build Verification
  # ----------------------------------------------------------------------------
  quality:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Run Type Checking
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Next.js Production Build
        run: pnpm build

  # ----------------------------------------------------------------------------
  # Job 2: Docker Build Validation (Pull Requests Only)
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-workstation-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3: Build & Publish Production Container (Main Branch & Releases)
  # ----------------------------------------------------------------------------
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Dynamic Metadata & Image Tags
        id: meta
        run: |
          # Lowercase owner/repository resolution for GHCR compliance
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/ai-workstation"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          TAGS="${IMAGE}:latest,${IMAGE}:sha-${SHORT_SHA}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${{ github.ref_name }}"
            TAGS="${TAGS},${IMAGE}:${VERSION_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 4: Safe Container Image Retention & Stale Version Pruning
  # Strictly preserves: 1) latest, 2) previous release/image. Prunes older.
  # ----------------------------------------------------------------------------
  retention-cleanup:
    name: Retain Latest & Previous Release
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prune Stale Image Versions (Keep Latest + Previous Release)
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'ai-workstation'
          package-type: 'container'
          min-versions-to-keep: 2
          ignore-versions: '^(latest)$'
        continue-on-error: true
