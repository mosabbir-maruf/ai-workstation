name: Build AI Workstation

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-workstation-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-workstation

jobs:
  build:
    name: Build and publish ARM64 image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old GHCR image versions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packageName = "ai-workstation";
            const keepVersions = 2;

            console.log(`Package: ${packageName}`);
            console.log(`Retention: newest ${keepVersions} versions`);

            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser,
              {
                package_type: "container",
                package_name: packageName,
                per_page: 100,
              }
            );

            const activeVersions = versions
              .filter((version) => !version.deleted_at)
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              );

            console.log(`Found ${activeVersions.length} active versions.`);

            if (activeVersions.length <= keepVersions) {
              console.log("Nothing to delete.");
              return;
            }

            const versionsToDelete = activeVersions.slice(keepVersions);

            console.log(
              `Deleting ${versionsToDelete.length} old image versions...`
            );

            for (const version of versionsToDelete) {
              console.log(
                `Deleting version ${version.id} ` +
                `(created ${version.created_at})`
              );

              await github.rest.packages.deletePackageVersionForAuthenticatedUser(
                {
                  package_type: "container",
                  package_name: packageName,
                  package_version_id: version.id,
                }
              );
            }

            console.log("GHCR cleanup completed successfully.");
